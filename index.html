<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Modern HTML Email Template</title>
	<style type="text/css">
		body {
			margin: 0;
			background-color: #cccccc;
		}

		table {
			border-collapse: collapse;
			border-spacing: 0;
		}

		td {
			padding: 0;
		}

		img {
			border: 0;
		}

		.wrapper {
			table-layout: fixed;
			background-color: #cccccc;
			padding-bottom: 60px;
		}

		.main {
			width: 100%;
			max-width: 600px;
			margin: 0 auto;
			background-color: #ffffff;
			border-spacing: 0;
			font-family: Arial, Helvetica, sans-serif;
			color: #171a1b;
		}

		.two-columns {
			text-align: center;
			font-size: 0;
		}

		.two-columns .column {
			width: 100%;
			max-width: 300px;
			display: inline-block;
			vertical-align: top;
			text-align: center;
		}

		.social-media {
			margin: 0 1px;
		}
	</style>
</head>

<body>

	<table class="wrapper" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
		<tr>
			<td align="center">
				<table class="main" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

					<!-- TOP BORDER -->
					<tr>
						<td height="8" style="background-color: #171a1b"></td>
					</tr>

					<!-- LOGO SECTION -->
					<tr>
						<td style="padding: 14px 0 4px;">
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

								<tr>
									<td class="two-columns">

										<table class="column" role="presentation" width="100%" cellpadding="0"
											cellspacing="0" border="0">
											<tr>
												<td style="padding: 0 62px 10px;"><a
														href="https://responsivehtmlemail.com/html-email-course/"><img
															src="./img/modern.jpg" width="170px" alt="Modern Logo"
															title="Modern Logo"></a></td>
											</tr>
										</table>

										<table class="column" role="presentation" width="100%" cellpadding="0"
											cellspacing="0" border="0">
											<tr>
												<td style="padding: 10px 72px">
													<a class="social-media" href="#">
														<img src="./img/black-facebook.png" alt="facebook logo"
															title="facebook" width="29px">
													</a>
													<a class="social-media" href="#">
														<img src="./img/black-instagram.png" alt="instagram logo"
															title="instagram" width="29px">
													</a>
													<a class="social-media" href="#">
														<img src="./img/black-twitter.png" alt="twitter logo"
															title="twitter" width="29px">
													</a>
													<a class="social-media" href="#">
														<img src="./img/black-linkedin.png" alt="linkedin logo"
															title="linkedin" width="29px">
													</a>
													<a class="social-media" href="#">
														<img src="./img/black-youtube.png" alt="youtube logo"
															title="youtube" width="29px">
													</a>
												</td>
											</tr>
										</table>

									</td>
								</tr>

							</table>
						</td>
					</tr>

					<!-- BANNER IMAGE -->


					<!-- THREE COLUMN SECTION -->


					<!-- TWO COLUMN SECTION -->


					<!-- TITLE, TEXT & BUTTON -->


					<!-- FOOTER SECTION -->
				</table>
			</td>
		</tr>

	</table>

</body>

</html>
